<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeserf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #14181f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            padding: 14px 20px 6px;
            text-align: center;
        }

        h1 {
            font-size: 1.25em;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #e8e8e8;
        }

        .subtitle {
            font-size: 0.78em;
            opacity: 0.45;
            margin-top: 2px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            width: 100%;
        }

        #gameContainer {
            background: #000;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            max-width: 1024px;
            width: 100%;
        }

        #canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

            #loadingOverlay.hidden {
                opacity: 0;
                pointer-events: none;
            }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #6aa84f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #statusText {
            font-size: 0.9em;
            color: #bbb;
            min-height: 20px;
        }

        #startButton {
            display: none;
            margin-top: 16px;
            padding: 10px 28px;
            font-size: 0.95em;
            background: #6aa84f;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
        }

            #startButton:hover {
                background: #7cbb60;
            }

            #startButton.visible {
                display: inline-block;
            }

        #uploadArea {
            display: none;
            margin-top: 20px;
            text-align: center;
            max-width: 440px;
            padding: 18px 22px;
            border: 1px dashed rgba(255,255,255,0.25);
            border-radius: 8px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

            #uploadArea.visible {
                display: block;
            }

            #uploadArea.dragover {
                border-color: #6aa84f;
                background: rgba(106,168,79,0.08);
            }

            #uploadArea p {
                font-size: 0.85em;
                color: #bbb;
                margin-bottom: 12px;
                line-height: 1.4;
            }

            #uploadArea .hint {
                font-size: 0.72em;
                opacity: 0.5;
                margin-top: 10px;
                margin-bottom: 0;
            }

        .upload-btn {
            display: inline-block;
            padding: 10px 24px;
            font-size: 0.9em;
            background: #6aa84f;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
        }

            .upload-btn:hover {
                background: #7cbb60;
            }

        #fileInput {
            display: none;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .control-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s ease;
        }

            .control-btn:hover {
                background: rgba(255,255,255,0.12);
                color: #fff;
            }

        footer {
            padding: 12px;
            font-size: 0.7em;
            opacity: 0.4;
            text-align: center;
        }

            footer a {
                color: #6aa84f;
                text-decoration: none;
            }
    </style>
</head>
<body>
    <header>
        <h1>Freeserf</h1>
        <p class="subtitle">Settlers 1 Recreation · WebAssembly</p>
    </header>

    <main>
        <div id="gameContainer">
            <canvas id="canvas" width="1024" height="768" tabindex="1"></canvas>

            <div id="loadingOverlay">
                <div class="spinner" id="spinner"></div>
                <div id="statusText">Loading game...</div>
                <button id="startButton">Start game</button>
                <div id="uploadArea">
                    <p>Game data not found. Select the original game data files (SPA*.PA) to play:</p>
                    <input type="file" id="fileInput" accept=".PA,.pa" multiple>
                    <label for="fileInput" class="upload-btn">Choose files…</label>
                    <p class="hint">Drag &amp; drop or click to select SPAE.PA / SPAD.PA / SPAF.PA / SPAU.PA</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button class="control-btn" id="muteBtn" onclick="toggleSound()">🔊 Sound</button>
        </div>
    </main>

    <footer>
        <a href="https://dos-ise.github.io/freeserf-wasm/" target="_blank">Play Freeserf</a> · <a href="https://github.com/freeserf/freeserf" target="_blank">Freeserf</a> · Open Source Recreation
    </footer>

    <script>
        // Emscripten Module Configuration
        var Module = {
            canvas: document.getElementById('canvas'),

            // Command-line Argumente für Freeserf
            arguments: ['-g', '/data'],  // -g = data directory, /data = VFS Pfad

            // WICHTIG: Verhindere automatischen Start von main()
            noInitialRun: true,

            print: function (text) {
                console.log('[Freeserf]', text);
            },

            printErr: function (text) {
                console.error('[Freeserf Error]', text);
            },

            setStatus: function (text) {
                const statusText = document.getElementById('statusText');
                const startButton = document.getElementById('startButton');
                const loadingOverlay = document.getElementById('loadingOverlay');

                if (!text) {
                    statusText.textContent = 'Ready to play!';
                    startButton.classList.add('visible');
                } else if (text.includes('Running')) {
                    loadingOverlay.classList.add('hidden');
                } else {
                    statusText.textContent = text;
                }
            },

            totalDependencies: 0,

            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                if (left === 0) {
                    Module.setStatus('');
                } else {
                    Module.setStatus('Loading dependencies... (' + left + ')');
                }
            },

            preRun: [],

            postRun: [
                function () {
                    console.log('Freeserf initialized!');

                    // Setup IndexedDB für persistente Savegames
                    if (FreeserfInstance && FreeserfInstance.FS) {
                        try {
                            FreeserfInstance.FS.mkdir('/saves');
                            FreeserfInstance.FS.mount(FreeserfInstance.IDBFS, {}, '/saves');
                            FreeserfInstance.FS.syncfs(true, function (err) {
                                if (err) {
                                    console.warn('Could not load saves:', err);
                                }
                            });
                        } catch (e) {
                            console.warn('IndexedDB not available:', e.message);
                        }
                    }
                }
            ],

            onRuntimeInitialized: function () {
                console.log('Runtime initialized');
            }
        };

        // Start Button Handler
        document.getElementById('startButton').addEventListener('click', function () {
            startGame();
        });

        // Fullscreen Toggle
        function toggleFullscreen() {
            const canvas = document.getElementById('canvas');
            if (!document.fullscreenElement) {
                canvas.requestFullscreen().catch(err => {
                    alert('Fullscreen not available: ' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Sound Toggle
        let soundMuted = false;
        function toggleSound() {
            soundMuted = !soundMuted;
            const btn = document.getElementById('muteBtn');
            btn.textContent = soundMuted ? '🔇 Muted' : '🔊 Sound';
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

        // Error Handling
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            console.error('Error:', msg, 'at', url, lineNo + ':' + columnNo);
            const statusText = document.getElementById('statusText');
            statusText.textContent = 'Failed to load: ' + msg;
            statusText.style.color = '#ff5252';
            return false;
        };

        // Prevent accidental page unload
        window.addEventListener('beforeunload', function (e) {
            if (FreeserfInstance && FreeserfInstance.HEAPU8) { // Check if game is running
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });
    </script>

    <!-- Emscripten generiert diese Datei beim Build -->
    <script src="FreeSerf.js"></script>
    <script>
        // Globale Instance Referenz
        var FreeserfInstance = null;
        var gameStarted = false;

        // Startet das Spiel (ruft main() auf)
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('hidden');

            // Focus Canvas für Keyboard Input
            const canvas = document.getElementById('canvas');
            canvas.focus();

            try {
                FreeserfInstance.callMain(Module.arguments || []);
            } catch (e) {
                console.error('main() error:', e);
            }
        }

        function writeFileToVFS(instance, path, buffer) {
            instance.FS.writeFile(path, new Uint8Array(buffer));
        }

        // Lade Game Data Files zur Laufzeit ins virtuelle Dateisystem
        function loadGameData() {
            return new Promise(function (resolve, reject) {
                FreeSerf(Module).then(function (instance) {
                    FreeserfInstance = instance;

                    // Erstelle /data und /resources Verzeichnisse
                    try {
                        instance.FS.mkdir('/data');
                    } catch (e) { }
                    try {
                        instance.FS.mkdir('/resources');
                    } catch (e) { }

                    // Lade Game Data Files
                    var dataFiles = ['SPAE.PA', 'SPAD.PA', 'SPAF.PA', 'SPAU.PA'];
                    var loadPromises = [];

                    dataFiles.forEach(function (filename) {
                        var promise = fetch('data/' + filename)
                            .then(function (response) {
                                if (!response.ok) {
                                    throw new Error('Not found');
                                }
                                return response.arrayBuffer();
                            })
                            .then(function (buffer) {
                                writeFileToVFS(instance, '/data/' + filename, buffer);
                                return filename;
                            })
                            .catch(function () {
                                // Datei nicht gefunden - OK, versuche nächste
                                return null;
                            });

                        loadPromises.push(promise);
                    });

                    // Lade die Ressourcen (TrueType-Font, UI-Bilder)
                    var resourceFiles = ['settlers.ttf', 'button-advanced.png'];
                    resourceFiles.forEach(function (filename) {
                        var promise = fetch('resources/' + filename)
                            .then(function (response) {
                                if (!response.ok) {
                                    throw new Error('Not found');
                                }
                                return response.arrayBuffer();
                            })
                            .then(function (buffer) {
                                writeFileToVFS(instance, '/resources/' + filename, buffer);
                                return filename;
                            })
                            .catch(function () {
                                // Ressource nicht gefunden - OK, Fallback wird genutzt
                                return null;
                            });

                        loadPromises.push(promise);
                    });

                    // Warte bis alle Dateien geladen wurden
                    Promise.all(loadPromises).then(function (results) {
                        var loaded = results.filter(function (r) { return r !== null; });
                        var dataLoaded = loaded.some(function (r) {
                            return dataFiles.indexOf(r) !== -1;
                        });
                        resolve({ instance: instance, dataLoaded: dataLoaded });
                    }).catch(reject);

                }).catch(reject);
            });
        }

        // Starte den Ladevorgang
        loadGameData()
            .then(function (result) {
                if (result.dataLoaded) {
                    // Spieldaten gefunden - Spiel starten
                    startGame();
                } else {
                    // Keine Spieldaten gefunden - Upload anbieten statt Fehler
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('startButton').classList.remove('visible');
                    document.getElementById('statusText').textContent = 'Game data not found';
                    document.getElementById('uploadArea').classList.add('visible');
                }
            })
            .catch(function (err) {
                console.error('Load error:', err);
                const statusText = document.getElementById('statusText');
                statusText.textContent = 'Failed to load the game.';
                statusText.style.color = '#ff5252';
            });

        // Upload: SPA*.PA Dateien ins virtuelle Dateisystem schreiben und starten
        function handleFiles(source) {
            var files = Array.prototype.slice.call(source.files || []);
            var paFiles = files.filter(function (f) {
                return /\.pa$/i.test(f.name);
            });
            if (paFiles.length === 0) {
                alert('Please select the game data files (SPA*.PA).');
                return;
            }

            var statusText = document.getElementById('statusText');
            statusText.textContent = 'Loading game data...';
            document.getElementById('uploadArea').classList.remove('visible');

            var reads = paFiles.map(function (f) {
                return f.arrayBuffer().then(function (buffer) {
                    writeFileToVFS(FreeserfInstance, '/data/' + f.name.toUpperCase(), buffer);
                });
            });

            Promise.all(reads).then(function () {
                startGame();
            }).catch(function (err) {
                console.error('Upload error:', err);
                statusText.textContent = 'Failed to load the selected files.';
                statusText.style.color = '#ff5252';
            });
        }

        document.getElementById('fileInput').addEventListener('change', function (e) {
            handleFiles(e.target);
        });

        // Drag & Drop
        var uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', function (e) {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', function () {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', function (e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer);
        });
    </script>
</body>
</html>
